services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_MODE: ${APP_MODE:-analysis}
      KILL_SWITCH: ${KILL_SWITCH:-true}
      DATABASE_PATH: /data/market.db
    volumes:
      - criptolab_data:/data
      - ./settings.yaml:/app/settings.yaml:ro
      - ./.env:/app/.env:ro
    ports:
      - "${API_PORT:-8001}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      APP_MODE: ${APP_MODE:-analysis}
      KILL_SWITCH: ${KILL_SWITCH:-true}
      DATABASE_PATH: /data/market.db
    volumes:
      - criptolab_data:/data
      - ./settings.yaml:/app/settings.yaml:ro
      - ./.env:/app/.env:ro
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: ${API_BASE:-http://api:8000/api/v1}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3001}:3000"
    restart: unless-stopped

volumes:
  criptolab_data:
