name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  APP_MODE: analysis
  KILL_SWITCH: "true"
  DATABASE_PATH: ./data/market.db

jobs:
  lint-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,backtesting,dashboard,api]"
      - name: Lint (ruff check)
        run: ruff check app/ scripts/ tests/
      - name: Format check (ruff format)
        run: ruff format --check app/ scripts/ tests/
      - name: Type check (mypy)
        run: mypy app/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,backtesting,dashboard,api]"
      - name: Create data directory
        run: mkdir -p data
      - name: Test with coverage (pytest)
        run: pytest --tb=short -x --cov=. --cov-report=term --cov-report=xml --cov-fail-under=60
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: github.ref == 'refs/heads/main'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,backtesting,dashboard,api]"
          pip install bandit pip-audit
      - name: Hardcoded secrets scan (bandit)
        run: bandit -r app/ -x tests/ --quiet || true
      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Build package
        run: python -m build

  quality-gate:
    runs-on: ubuntu-latest
    needs: [lint-check, test]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,backtesting,dashboard,api]"
      - name: Create data directory
        run: mkdir -p data
      - name: Run quality gate
        run: python -m quality.quality_agent --check-all
